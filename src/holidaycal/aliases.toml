# Holidays known under several names. Each entry is one holiday: its id is the
# merge key, and its value lists the holiday's names, in `merge.unaliased`
# form, as tiers in order of preference. A merged event is named after the
# occurrence whose name is in the earliest tier; within a tier, the top-most
# configured source wins. Names only merge when they fall on the same date.
#
# Keep ids in alphabetical order. A name belongs to at most one holiday.

