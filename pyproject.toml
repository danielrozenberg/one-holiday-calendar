[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holidaycal"
version = "1.0.0"
description = "Merged, configurable holiday calendars served as webcal feeds."
readme = "docs/DESIGN.md"
requires-python = ">=3.13"
dependencies = [
    "holidays==0.109",
    "flask==3.1.3",
    "icalendar==7.3.0",
    "gunicorn==27.0.1",
    "protobuf==7.36.2",
    "pydantic==2.14.3",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.5",
    "pyrefly==1.5.0",
    "pytest==9.2.0",
    "grpcio-tools==1.85.3",
    "mypy-protobuf==5.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/holidaycal"]

[tool.ruff]
# Follow Google's Python style guide: 4-space indent, 80-column lines.
line-length = 80
src = ["src", "tests"]
target-version = "py313"
extend-exclude = ["src/holidaycal/*_pb2.py", "src/holidaycal/*_pb2.pyi"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
# D203/D213 conflict with the Google convention's D211/D212; let the convention pick.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["holidaycal"]
force-single-line = true
single-line-exclusions = ["typing", "collections.abc"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]  # tests don't need docstrings

[tool.pyrefly]
project-includes = ["src", "tests"]
project-excludes = ["src/holidaycal/*_pb2.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
